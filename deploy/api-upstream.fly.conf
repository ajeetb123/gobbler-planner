# Where nginx finds the API on Fly.io (see fly.toml and fly.api.toml).
# The API is a second Fly app with no public address. Apps in one Fly organization reach each other on a private
# IPv6 network at <app name>.internal, and fdaa::3 is that network's name server.
# If the API app is created under another name, change it here.
resolver [fdaa::3] valid=30s;
set $api http://gobbler-plan-api.internal:3000;
# On Fly the connection to nginx comes from Fly's proxy, so $remote_addr is the proxy. Fly puts the visitor's
# address in Fly-Client-IP and overwrites anything the client sent under that name.
proxy_set_header X-Real-IP $http_fly_client_ip;
