# Serves the static planner. Every page, script and style comes from this server; nothing is loaded from elsewhere.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  error_page 404 /404.html;

  gzip on;
  gzip_types text/css application/javascript application/json;
  gzip_min_length 1024;

  # Security headers. Scripts and data may only come from this site; inline styles are allowed because pages use style attributes.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Used by the container health check and by hosting platforms.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # The API (usage counts and the owner's dashboard) runs in a second container named "api".
  # Using a variable makes nginx look the name up per request, so this container still starts and serves the
  # static site when no API is running; those requests then answer 502 and the pages carry on without it.
  resolver 127.0.0.11 valid=30s ipv6=off;
  location ~ ^/(api/|admin) {
    set $api http://api:3000;
    client_max_body_size 2k;
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # The caller's address, used only to make the daily anonymous visitor code. Overwrites anything the client sent.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
  }

  # Pages change on every deploy: always revalidate. Shared CSS and JS can be cached for an hour.
  location ~* \.(css|js|json)$ {
    add_header Cache-Control "public, max-age=3600";
    add_header Content-Security-Policy "default-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }
  location / {
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri $uri/ =404;
  }
}
