# Where nginx finds the API when both containers run under Docker Compose (see compose.yaml).
# Docker's built-in name server answers for the service name "api".
resolver 127.0.0.11 valid=30s ipv6=off;
set $api http://api:3000;
# The caller's address, used only to make the daily anonymous visitor code. Overwrites anything the client sent.
proxy_set_header X-Real-IP $remote_addr;
