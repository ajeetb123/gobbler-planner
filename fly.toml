# Fly.io: the public website (nginx serving the static planner). Deploy with:  fly deploy
# The API is a second app, see fly.api.toml.
app = "gobbler-plan"
primary_region = "iad" # Ashburn, Virginia

[build]
  dockerfile = "Dockerfile"
  [build.args]
    API_UPSTREAM = "fly"

[http_service]
  internal_port = 8080
  force_https = true
  # One small machine stays up so the first visitor never waits for a cold start.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "3s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
